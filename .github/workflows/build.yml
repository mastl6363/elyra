name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build (Windows)
        run: dotnet build src/Elyra/Elyra.csproj -f net10.0-windows10.0.19041.0 --configuration Release

      - name: Test
        run: dotnet test tests/Elyra.Tests/Elyra.Tests.csproj --configuration Release
